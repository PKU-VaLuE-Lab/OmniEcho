# @package _global_
#
# Habitat config for **pure vision-language navigation (VLN)** on OmniEchoBench-Nav real-scanned scenes (for the VLN-CE baseline).
# Same cameras/actions/sensors as the spatial-audio evaluation:
#   * split = case3_vln (900 published episodes, English instructions + tokens);
#   * success_distance = 1.0 (success criterion: within 1 meter);
#   * camera height 0.45m (robot-dog height), 640x480 hfov79, consistent with the spatial-audio evaluation.
# All audio is ignored -- the baseline consumes only rgb+depth+instruction_tokens.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0.0, 0.45, 0.0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
            position: [0.0, 0.45, 0.0]
    forward_step_size: 0.25
    turn_angle: 15
    tilt_angle: 15
    action_space_config: "v1"
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 1.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
    actions:
      stop:
        type: StopAction
        agent_index: 0
      move_forward:
        type: MoveForwardAction
        agent_index: 0
      turn_left:
        type: TurnLeftAction
        agent_index: 0
      turn_right:
        type: TurnRightAction
        agent_index: 0
      look_up:
        type: LookUpAction
        agent_index: 0
      look_down:
        type: LookDownAction
        agent_index: 0

  dataset:
    type: R2RVLN-v1
    split: case3_vln
    scenes_dir: data/OmniEchoBench/OmniEchoBench-NAV/scene_data/case3_ce
    data_path: data/OmniEchoBench/OmniEchoBench-NAV/scene_data/case3_ce/episodes/{split}.json.gz
